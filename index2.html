<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하치와레 짤 만들기</title>
<style>
:root{--bg:#f4f8fb;--fg:#1d2b36;--card:#fff;--ac:#5b93c4;--bd:#d5e2ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202a;--fg:#e8f0f6;--card:#1d2d3a;--bd:#2f4455}}
:root[data-theme="dark"]{--bg:#14202a;--fg:#e8f0f6;--card:#1d2d3a;--bd:#2f4455}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:22px;margin:0 0 14px}
canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--bd);display:block}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px;display:grid;gap:12px}
label{font-size:14px;display:grid;gap:6px}
input[type=text]{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--ac)}
button,.file{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--ac);text-align:center;cursor:pointer}
button{background:var(--ac);color:#fff}
.file{background:transparent;color:var(--fg)}
.file input{display:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body><main>
<h1>하치와레 짤 만들기</h1>
<canvas id="c"></canvas>
<div class="panel">
<label>넣을 문구<input type="text" id="t" value="Test message!!!"></label>
<label>글씨 크기<input type="range" id="s" min="20" max="160" value="70"></label>
<label>글씨 세로 위치<input type="range" id="y" min="5" max="95" value="85"></label>
<button id="d">PNG 이미지 만들기 · 다운로드</button>
</div></main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const img=new Image();
function draw(){
 if(!img.naturalWidth)return;
 c.width=img.naturalWidth;c.height=img.naturalHeight;
 x.drawImage(img,0,0);
 const size=+document.getElementById('s').value*(c.width/968);
 x.font='900 '+size+'px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
 x.textAlign='center';x.textBaseline='middle';
 x.lineJoin='round';x.lineWidth=size/5;x.strokeStyle='#000';x.fillStyle='#fff';
 const px=c.width/2,py=c.height*document.getElementById('y').value/100;
 const t=document.getElementById('t').value;
 x.strokeText(t,px,py,c.width*0.95);x.fillText(t,px,py,c.width*0.95);
}
img.onload=draw;
img.src="IMG_8778.jpeg";
['t','s','y'].forEach(i=>document.getElementById(i).addEventListener('input',draw));
document.getElementById('d').addEventListener('click',()=>{
 const a=document.createElement('a');
 a.download='hachiware.png';a.href=c.toDataURL('image/png');a.click();
});;
</script></body></html>
